<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoDo.txt</title>
  <link rel="icon" type="image/png" href="vodotxticon (512x512 for Google Play).jpg">
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #24292e;
      --accent-color: #0366d6;
      --light-bg: #f6f8fa;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: var(--text-color);
      background-color: var(--bg-color);
      max-width: 600px;
      margin: 80px auto;
      padding: 0 20px;
      text-align: center;
    }
    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }
    p {
      color: #586069;
      font-size: 1.1em;
      margin-bottom: 30px;
    }
    .links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    a {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 500;
      padding: 10px 20px;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      background-color: var(--light-bg);
      transition: background-color 0.2s;
    }
    a:hover {
      background-color: #e1e4e8;
    }
    footer {
      margin-top: 80px;
      font-size: 0.9em;
      color: #6a737d;
    }
  </style>
</head>
<body>

  <h1>VoDo.txt</h1>
  <p>An Android to do application based using the todo.txt format plus robust task recurrence and Google Drive integration.</p>

  <div class="links">
    <a href="privacy_policy.html">Privacy Policy</a>
    <a href="https://github.com/fleapower/vodotxt/" target="_blank" rel="noopener">GitHub Repository</a>
  </div>

  <footer>
    <p>&copy; <span id="current-year"></span> James Baca. All rights reserved.</p>
  </footer>

  <script>
    document.getElementById('current-year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
